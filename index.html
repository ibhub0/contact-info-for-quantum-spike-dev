<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Developer Contact Portal - Support & Direct">
    <title>Developer Contact</title>
    
    <!-- Google Fonts: JetBrains Mono & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Dark Theme (Default) */
        :root[data-theme="dark"] {
            --bg-color: #090d16;
            --bg-glow-1: rgba(79, 172, 254, 0.14);
            --bg-glow-2: rgba(139, 92, 246, 0.14);
            --card-bg: rgba(17, 24, 39, 0.85);
            --terminal-bg: rgba(11, 15, 25, 0.92);
            --item-bg: rgba(255, 255, 255, 0.03);
            --item-hover-bg: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.09);
            --border-hover: rgba(0, 242, 254, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --title-grad: linear-gradient(90deg, #ffffff, #9ca3af);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #a78bfa;
            --btn-bg: rgba(255, 255, 255, 0.06);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 30px rgba(0, 242, 254, 0.05);
            --toast-bg: #111827;
        }

        /* Light Theme */
        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --bg-glow-1: rgba(56, 189, 248, 0.2);
            --bg-glow-2: rgba(168, 85, 247, 0.15);
            --card-bg: rgba(255, 255, 255, 0.88);
            --terminal-bg: rgba(241, 245, 249, 0.95);
            --item-bg: rgba(15, 23, 42, 0.025);
            --item-hover-bg: rgba(15, 23, 42, 0.05);
            --border-color: rgba(15, 23, 42, 0.1);
            --border-hover: rgba(2, 132, 199, 0.45);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --title-grad: linear-gradient(90deg, #0f172a, #475569);
            --accent-cyan: #0284c7;
            --accent-blue: #2563eb;
            --accent-purple: #7c3aed;
            --btn-bg: rgba(15, 23, 42, 0.05);
            --shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12), 0 0 20px rgba(2, 132, 199, 0.06);
            --toast-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, var(--bg-glow-1) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, var(--bg-glow-2) 0%, transparent 40%);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        /* Card Container */
        .dev-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.35s ease;
        }

        .dev-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
        }

        /* Terminal Top Bar */
        .terminal-header {
            background: var(--terminal-bg);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.35s ease;
        }

        .window-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .terminal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Theme Toggle Button in Header */
        .theme-toggle {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            transform: rotate(15deg);
        }

        /* Profile / Intro Section */
        .card-body {
            padding: 24px;
        }

        .dev-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .card-title {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            background: var(--title-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: var(--accent-blue);
            margin-bottom: 22px;
            font-weight: 500;
        }

        /* Contact Items List */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .contact-item {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .contact-item:hover {
            background: var(--item-hover-bg);
            border-color: var(--border-hover);
            transform: translateX(3px);
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .icon-box.email {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .icon-box.tg-bot {
            background: rgba(0, 242, 254, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.25);
        }

        .item-info {
            min-width: 0;
        }

        .item-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: 600;
        }

        .item-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Action Buttons */
        .item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .action-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(79, 172, 254, 0.15);
            color: var(--accent-cyan);
            border-color: var(--border-hover);
        }

        .action-btn.copied {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border-color: #10b981;
        }

        /* Footer Code Snippet */
        .card-footer {
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .code-tag {
            color: var(--accent-purple);
            font-weight: 600;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--toast-bg);
            border: 1px solid #10b981;
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            color: #10b981;
        }
    </style>
</head>
<body>

    <div class="dev-card">
        <!-- Terminal Top Bar -->
        <div class="terminal-header">
            <div class="window-dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div class="terminal-title">
                <i class="fa-solid fa-terminal"></i> contact_info.sh
            </div>
            <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
                <i class="fa-solid fa-sun" id="theme-icon"></i>
            </button>
        </div>

        <!-- Main Card Body -->
        <div class="card-body">
            <div class="dev-badge">
                <span class="status-dot"></span> SYSTEM ONLINE
            </div>
            <h1 class="card-title">Developer Contact</h1>
            <p class="card-subtitle">&lt;QuantumHub / Support &amp; Direct&gt;</p>

            <div class="contact-list">
                <!-- Email Item -->
                <div class="contact-item">
                    <div class="item-left">
                        <div class="icon-box email">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-label">Email</div>
                            <div class="item-value">quantumhub07@gmail.com</div>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="action-btn" onclick="copyText('quantumhub07@gmail.com', this)" title="Copy Email">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <a href="mailto:quantumhub07@gmail.com" class="action-btn" title="Send Email">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                </div>

                <!-- Telegram Item -->
                <div class="contact-item">
                    <div class="item-left">
                        <div class="icon-box tg-bot">
                            <i class="fa-brands fa-telegram"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-label">Telegram</div>
                            <div class="item-value">@talk_mrs_bot</div>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="action-btn" onclick="copyText('@talk_mrs_bot', this)" title="Copy Username">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <a href="https://t.me/talk_mrs_bot" target="_blank" rel="noopener noreferrer" class="action-btn" title="Open in Telegram">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Card Footer -->
            <div class="card-footer">
                <span><span class="code-tag">status:</span> 200 OK</span>
                <span><i class="fa-solid fa-bolt" style="color: #f59e0b;"></i> Fast Response</span>
            </div>
        </div>
    </div>

    <!-- Copy Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-msg">Copied to clipboard!</span>
    </div>

    <script>
        // Theme Switcher with LocalStorage Persistence
        const htmlEl = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');

        const savedTheme = localStorage.getItem('dev_card_theme') || 'dark';
        applyTheme(savedTheme);

        function toggleTheme() {
            const currentTheme = htmlEl.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
            localStorage.setItem('dev_card_theme', newTheme);
        }

        function applyTheme(theme) {
            htmlEl.setAttribute('data-theme', theme);
            if (theme === 'light') {
                themeIcon.className = 'fa-solid fa-moon';
            } else {
                themeIcon.className = 'fa-solid fa-sun';
            }
        }

        // Copy to Clipboard Functionality
        let toastTimeout;

        function copyText(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btnElement.querySelector('i');
                const originalClass = icon.className;
                
                btnElement.classList.add('copied');
                icon.className = 'fa-solid fa-check';

                setTimeout(() => {
                    btnElement.classList.remove('copied');
                    icon.className = originalClass;
                }, 1800);

                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toast-msg');
                toastMsg.textContent = `Copied: ${text}`;
                toast.classList.add('show');

                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            });
        }
    </script>

</body>
</html>
