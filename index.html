<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact – Mr Infinity</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoYz1HI5W8F7aZ9U6V9K/6a6Uq1v5V4n5pJY2PpG1rR5J7c" crossorigin="anonymous" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root {
      --bg-light: #fff;
      --bg-dark: #121212;
      --text-light: #222;
      --text-dark: #e0e0e0;
      --primary: #0d6efd;
    }
    [data-theme="dark"] {
      --bg-color: var(--bg-dark);
      --text-color: var(--text-dark);
      --link-color: #58a6ff;
    }
    [data-theme="light"] {
      --bg-color: var(--bg-light);
      --text-color: var(--text-light);
      --link-color: var(--primary);
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color .3s, color .3s;
    }
    a {
      color: var(--link-color);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .hero {
      background: linear-gradient(135deg, #4e54c8, #8f94fb);
      color: #fff;
      padding: 4rem 1rem;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    .contact-card {
      border: none;
      border-radius: .75rem;
      transition: transform .2s, box-shadow .2s;
    }
    .contact-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
    }
    .icon {
      font-size: 1.5rem;
      margin-right: 0.5rem;
    }
    .toggle-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: none;
      border: 2px solid var(--text-color);
      border-radius: .4rem;
      padding: .3rem .6rem;
      cursor: pointer;
      color: var(--text-color);
    }
    footer {
      text-align: center;
      padding: 1rem 0;
      margin-top: 2rem;
      font-size: .9rem;
      color: var(--text-color);
    }
  </style>
</head>
<body data-theme="light">
  <button class="toggle-btn" id="themeToggle">Toggle Dark/Light</button>
  <section class="hero">
    <h1>Contact Me</h1>
    <p>Mr Infinity aka M Pal</p>
  </section>
  <div class="container my-5">
    <div class="row g-4 justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card contact-card h-100 p-4 bg-white bg-opacity-75">
          <div class="card-body text-center">
            <i class="fas fa-envelope icon"></i>
            <h5 class="card-title">Email</h5>
            <p class="card-text"><a href="mailto:infinitybotz2026@gmail.com">infinitybotz2026@gmail.com</a></p>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card contact-card h-100 p-4 bg-white bg-opacity-75">
          <div class="card-body text-center">
            <i class="fab fa-telegram-plane icon"></i>
            <h5 class="card-title">Telegram 1</h5>
            <p class="card-text"><a href="https://t.me/talk_mrs_bot" target="_blank">@talk_mrs_bot</a></p>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card contact-card h-100 p-4 bg-white bg-opacity-75">
          <div class="card-body text-center">
            <i class="fab fa-telegram-plane icon"></i>
            <h5 class="card-title">Telegram 2</h5>
            <p class="card-text"><a href="https://t.me/infinitymp007" target="_blank">@infinitymp007</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer>
    © 2026 Mr Infinity – All rights reserved.
  </footer>
  <script>
    // Theme toggle logic
    const toggleBtn = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme') || 'light';
    document.body.setAttribute('data-theme', saved);
    toggleBtn.textContent = saved === 'dark' ? 'Light Mode' : 'Dark Mode';
    toggleBtn.addEventListener('click', () => {
      const newTheme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.body.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      toggleBtn.textContent = newTheme === 'dark' ? 'Light Mode' : 'Dark Mode';
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+P5nY0nU+9E+3K3z0xQ5hXrC6iR9" crossorigin="anonymous"></script>
</body>
</html>
